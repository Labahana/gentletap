services:
  postgres:
    image: postgres:16-alpine
    container_name: gentletap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gentletap
      POSTGRES_PASSWORD: gentletap
      POSTGRES_DB: gentletap
    ports:
      - "5433:5432"
    volumes:
      - gentletap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gentletap -d gentletap"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gentletap-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: gentletap-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg2://gentletap:gentletap@postgres:5432/gentletap"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://redis:6379/1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        API_PROXY_URL: ${API_PROXY_URL:-http://api:8000}
    container_name: gentletap-web
    restart: unless-stopped
    environment:
      API_PROXY_URL: ${API_PROXY_URL:-http://api:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  gentletap_pgdata:

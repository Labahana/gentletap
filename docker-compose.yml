services:
  postgres:
    image: postgres:16-alpine
    container_name: gentletap-postgres
    environment:
      POSTGRES_USER: gentletap
      POSTGRES_PASSWORD: gentletap
      POSTGRES_DB: gentletap
    ports:
      - "5433:5432"
    volumes:
      - gentletap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gentletap -d gentletap"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gentletap-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  gentletap_pgdata:

services:
  postgres:
    image: postgres:16-alpine
    container_name: gentletap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gentletap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gentletap_postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-gentletap}
    volumes:
      - gentletap_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gentletap-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru --requirepass ${REDIS_PASSWORD:-choose-a-strong-redis-password}
    volumes:
      - gentletap_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD:-choose-a-strong-redis-password} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gentletap-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD:-choose-a-strong-redis-password}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:-choose-a-strong-redis-password}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD:-choose-a-strong-redis-password}@redis:6379/1"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Scale horizontally on VPS: docker compose up -d --scale worker=3
    # (no container_name — required for --scale)
    env_file:
      - .env
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD:-choose-a-strong-redis-password}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:-choose-a-strong-redis-password}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD:-choose-a-strong-redis-password}@redis:6379/1"
    entrypoint: ["celery", "-A", "app.workers.celery_app", "worker", "-l", "info", "--concurrency=4"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gentletap-beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD:-choose-a-strong-redis-password}@redis:6379/0"
      CELERY_BROKER_URL: "redis://:${REDIS_PASSWORD:-choose-a-strong-redis-password}@redis:6379/0"
      CELERY_RESULT_BACKEND: "redis://:${REDIS_PASSWORD:-choose-a-strong-redis-password}@redis:6379/1"
    entrypoint: ["celery", "-A", "app.workers.celery_app", "beat", "-l", "info"]
    volumes:
      - gentletap_celery_beat:/var/lib/celery
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a ${REDIS_PASSWORD:-choose-a-strong-redis-password} ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gentletap-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  gentletap_pgdata:
  gentletap_redis:
  gentletap_celery_beat:

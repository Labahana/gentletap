# Local dev overlay — adds Postgres. Use:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: gentletap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gentletap
      POSTGRES_PASSWORD: gentletap
      POSTGRES_DB: gentletap
    ports:
      - "5433:5432"
    volumes:
      - gentletap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gentletap -d gentletap"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    environment:
      DATABASE_URL: "postgresql+psycopg2://gentletap:gentletap@postgres:5432/gentletap"
      DATABASE_MIGRATIONS_URL: "postgresql+psycopg2://gentletap:gentletap@postgres:5432/gentletap"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    environment:
      DATABASE_URL: "postgresql+psycopg2://gentletap:gentletap@postgres:5432/gentletap"
    depends_on:
      postgres:
        condition: service_healthy

  beat:
    environment:
      DATABASE_URL: "postgresql+psycopg2://gentletap:gentletap@postgres:5432/gentletap"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  gentletap_pgdata:
